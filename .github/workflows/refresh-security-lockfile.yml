name: Refresh security lockfile

on:
  push:
    branches:
      - security/postcss-8.5.23
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh pnpm lockfile"
            git push origin HEAD:${{ github.ref_name }}
          fi
