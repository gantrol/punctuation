name: Security audit

on:
  push:
    branches:
      - security/postcss-8.5.23
    paths:
      - package.json
      - .github/workflows/security-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies
        run: pnpm audit --audit-level moderate
      - name: Check project
        run: pnpm run check
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh audited dependency lockfile"
            git push origin HEAD:${{ github.ref_name }}
          fi
